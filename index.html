<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Language Website</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <!-- Yuqori qism: Til tanlash tugmalari -->
        <div class="lang-buttons">
            <button class="lang-btn active" data-lang="uz">UZ</button>
            <button class="lang-btn" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="ru">RU</button>
        </div>

        <!-- Sarlavha -->
        <h1 id="site-title">Language Website</h1>

        <!-- O'zgacha ichki kontent bloki -->
        <div class="content">
            <h2 id="greeting">Salom, Dunyo!</h2>
        </div>

        <!-- Asosiy tugma -->
        <button id="action-btn" class="main-btn">Boshlash</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
